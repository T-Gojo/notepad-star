[package]
name = "star-extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Bounded, import-free WebAssembly selected-text extension worker"
readme = "README.md"

[dependencies]
serde.workspace = true
serde_json.workspace = true
star-io = { path = "../io" }
sha2 = "0.10"
wasmi = { version = "=0.46.0", default-features = false, features = ["std", "extra-checks", "prefer-btree-collections"] }
wasmparser = { version = "=0.228.0", default-features = false, features = ["std"] }
wat = { version = "=1.228.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
