name: Feature request
description: Suggest a capability for Notepad Star
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for **Notepad Star**. Requests for Notepad++ itself
        belong in the [upstream project](https://github.com/notepad-plus-plus/notepad-plus-plus).

        Notepad Star is working towards, but does not claim, Notepad++ parity.
        `compat/features.json` is a seed inventory rather than a feature
        checklist; `docs/COMPATIBILITY.md` lists the gates that are still open.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the task you are trying to accomplish, not only the proposed control.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: How should it look and behave? Mention menus, shortcuts or panels if relevant.
    validations:
      required: true
  - type: input
    id: upstream
    attributes:
      label: Equivalent Notepad++ behaviour (optional)
      description: If Notepad++ already does this, name the menu path or command.
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Platforms this should cover
      multiple: true
      options:
        - Windows x64
        - macOS Apple Silicon
    validations:
      required: false
