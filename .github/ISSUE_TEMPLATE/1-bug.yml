name: Bug report
description: Something in Notepad Star does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for **Notepad Star**, the application built from this
        repository. Issues about Notepad++ itself belong in the
        [upstream project](https://github.com/notepad-plus-plus/notepad-plus-plus),
        not here.

        Notepad Star is a release candidate and does not claim Notepad++ parity.
        Please check `docs/COMPATIBILITY.md` before reporting a missing feature
        as a bug.
  - type: input
    id: version
    attributes:
      label: Notepad Star version
      description: From Help -> About, or the `version` field in the package manifest.
      placeholder: 0.1.0-rc.6
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows x64
        - macOS Apple Silicon
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system version
      placeholder: Windows 11 24H2 / macOS 15.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, starting from a freshly launched editor.
      placeholder: |
        1. Open ...
        2. Click ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: document
    attributes:
      label: Document details (for crashes, corruption or data loss)
      description: >
        Was the document unsaved? Which encoding and line endings? Roughly how
        large was it? Do not paste confidential file contents.
    validations:
      required: false
